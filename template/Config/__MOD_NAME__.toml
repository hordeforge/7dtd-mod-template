# __MOD_DISPLAY_NAME__ settings. The DLL reads this file from the
# installed mod folder (Mods/__MOD_NAME__/Config/__MOD_NAME__.toml) at
# startup and again whenever you save it; no restart. It is not a game
# XML patch. `__MOD_NAME_LOWER__ set <name> <value>` changes this process
# until the file is re-read; `__MOD_NAME_LOWER__ reload` re-reads
# immediately. See `help __MOD_NAME_LOWER__`.
#
# Keys match the console names. Unknown keys and bad values fail loud
# (a warning in the log) and leave the default in place. Supported values:
# booleans, integers, floats, "strings", and arrays of those. Tables and
# dotted keys are rejected.
#
# The comment block directly above a key is that key's help text in the
# in-game Mod Settings screen (Wrench, hordeforge/7dtd-mod-settings), and
# may end with one `# ui: flags|enum|range ...` line to get checkboxes,
# a single choice, or numeric bounds instead of a raw text field.

# Example setting; replace with this mod's real options (each one needs
# its ModSettings.cs counterpart — see that file's header comment).
ExampleEnabled = false
