# Ruff is the Python gate for this modlet, the shellcheck of scripts/*.py.
# `make lint-py` runs it; every group below is one the tree already passes, so
# a new file that trips one is a real defect, not style drift.
line-length = 100
target-version = "py39"

[lint]
select = [
	"E",    # pycodestyle errors
	"W",    # pycodestyle warnings
	"F",    # pyflakes
	"I",    # import order
	"B",    # flake8-bugbear
	"A",    # flake8-builtins
	"ANN",  # flake8-annotations: every def carries a signature
	"C4",   # flake8-comprehensions
	"PIE",  # flake8-pie
	"PT",   # flake8-pytest-style
	"PLE",  # pylint errors
	"PLW",  # pylint warnings
	"RET",  # flake8-return
	"SIM",  # flake8-simplify
	"UP",   # pyupgrade
	"ISC",  # flake8-implicit-str-concat
	"ICN",  # flake8-import-conventions
	"ARG",  # flake8-unused-arguments: a parameter nobody reads is a forgotten wiring step
	"DTZ",  # flake8-datetimez: a naive datetime silently means local time
	"ERA",  # eradicate: commented-out code rots where it lies
	"G",    # flake8-logging-format: a %s where the message takes an arg
	"PGH",  # blanket noqa/type: ignore: a bare ignore is a suppression without a scope
	"RSE",  # flake8-raise: a raise inside redundant parens reads as a tuple
	"TID",  # flake8-tidy-imports: a relative import breaks the moment a script is run as one
	"RUF",  # ruff's own rules, including RUF100 (stale noqa)
]
