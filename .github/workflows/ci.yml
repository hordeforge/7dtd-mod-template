name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scaffold-smoke:
    runs-on: ubuntu-24.04
    # The job only checks out and builds; it never writes back or reads a
    # secret. Anything beyond read access is an unused grant.
    permissions:
      contents: read
    env:
      # make lint-shell and the packaging step are locale- and
      # timezone-independent by contract
      LC_ALL: C
      TZ: UTC
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Scaffold a throwaway mod
        run: |
          cat > ci-smoke.conf <<CONF
          name="CiSmoke"
          author="ci"
          purpose="Throwaway CI smoke mod proving the template scaffolds into a working modlet."
          target_dir="$RUNNER_TEMP/anvil-smoke"
          csharp="yes"
          assets="no"
          clone="no"
          hordeforge_root="$RUNNER_TEMP/hordeforge"
          CONF
          ./new-mod.sh ci-smoke.conf
      - name: Offline gates
        run: make -C "$RUNNER_TEMP/anvil-smoke/CiSmoke" test
      - name: Shellcheck
        run: make -C "$RUNNER_TEMP/anvil-smoke/CiSmoke" lint-shell
      - name: Package layout (no game install -> XML-only package)
        run: |
          cd "$RUNNER_TEMP/anvil-smoke/CiSmoke"
          rm -rf src   # DLL build needs a game install; prove the packaging path without it
          make package
          unzip -l dist/CiSmoke.zip | grep -q "CiSmoke/ModInfo.xml"
