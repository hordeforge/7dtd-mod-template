name: CI
on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a newer push supersedes an in-flight run instead of
# leaving two scaffolds racing for the same directory.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-smoke:
    runs-on: ubuntu-24.04
    # The job only checks out and builds; it never writes back or reads a
    # secret. Anything beyond read access is an unused grant.
    permissions:
      contents: read
    # A hung step must fail the run, not hold a runner until GitHub kills it.
    timeout-minutes: 20
    env:
      # make lint-shell and the packaging step are locale- and
      # timezone-independent by contract
      LC_ALL: C
      TZ: UTC
      # Pinned: ruff resolves the mod's rule set, and a release that changes
      # one of them turns the gate red for every open PR. Bump it here and
      # run `make lint-py` in a scaffolded mod before committing the bump.
      RUFF_VERSION: "0.16.4"
    steps:
      # Pinned by commit, not by tag: a tag is mutable, so a moved one swaps the
      # code this job runs for whatever an attacker or a mistake put there.
      # Dependabot opens the bump PR for the new tag's commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # nothing in this job pushes, and the job's own token grant is
          # contents: read
          persist-credentials: false
      - name: Scaffold a throwaway mod
        run: |
          # ci/smoke.conf is the one smoke config (a local run uses it
          # verbatim); only its two output paths are rerouted onto the runner.
          sed -e "s#^target_dir=.*#target_dir=\"$RUNNER_TEMP/anvil-smoke\"#" \
            -e "s#^hordeforge_root=.*#hordeforge_root=\"$RUNNER_TEMP/hordeforge\"#" \
            ci/smoke.conf > "$RUNNER_TEMP/anvil-smoke.conf"
          ./new-mod.sh "$RUNNER_TEMP/anvil-smoke.conf"
      - name: Scaffolded text
        # the values new-mod.sh substituted into ModInfo.xml: the smoke
        # config's characters that are XML-hostile, accented, or CJK have
        # to arrive intact rather than break the file
        run: python3 ci/check-smoke-mod.py "$RUNNER_TEMP/anvil-smoke/CiSmoke" ci/smoke.conf
      - name: Release notes
        # the template's own CHANGELOG.md, which no scaffolded mod can check:
        # it is the file a tag is cut from. Unreleased first, a dated section
        # per released version, versions that only go down the file.
        run: python3 ci/check-changelog.py CHANGELOG.md
      - name: Offline gates
        run: make -C "$RUNNER_TEMP/anvil-smoke/CiSmoke" test
      - name: Shellcheck
        run: make -C "$RUNNER_TEMP/anvil-smoke/CiSmoke" lint-shell
      - name: Install ruff
        # pinned: a floating ruff changes which findings the gate reports, so
        # the gate would start failing on an unchanged tree
        run: pipx install "ruff==$RUFF_VERSION"
      - name: Ruff
        run: make -C "$RUNNER_TEMP/anvil-smoke/CiSmoke" lint-py
      - name: Shellcheck the scaffolder
        # new-mod.sh and ci/*.sh are not copied into the modlet, so lint-shell
        # never sees them; gate them here or they are the unchecked shell
        # scripts in the repo.
        run: shellcheck -x --severity=style new-mod.sh ci/*.sh
      - name: Ruff over this repo's own python
        # ci/ is not copied into the modlet either, so the mod's lint-py
        # never sees it; the modlet's rule set is the one this repo writes
        # against.
        run: ruff check --config template/ruff.toml ci/
      - name: Package layout (no game install -> XML-only package)
        run: |
          cd "$RUNNER_TEMP/anvil-smoke/CiSmoke"
          rm -rf src   # DLL build needs a game install; prove the packaging path without it
          make package
          unzip -l dist/CiSmoke.zip | grep -q "CiSmoke/ModInfo.xml"
      - name: Reproducible package
        # the same source, zipped from a foreign path, locale, and timezone,
        # has to be the same bytes
        run: make -C "$RUNNER_TEMP/anvil-smoke/CiSmoke" verify-reproducible
      - name: Scaffolder with a non-UTF-8 config
        # a config value the user typed in an encoding that is not UTF-8 has
        # to scaffold as valid UTF-8, not as a traceback and no mod
        run: ci/scaffolder-encoding.sh
      - name: Scaffolder text boundaries
        # the description limit cuts at 200 code points, so a purpose in a
        # script where one character is several code points has to end on a
        # whole one; a name that draws nothing has to be refused, and an
        # author name has to fold into the Harmony id
        run: python3 ci/scaffold-text.py
