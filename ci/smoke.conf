# Scaffold smoke config: proves template/ instantiates into a working modlet.
# Paths are relative to the repo root and land in the gitignored .scratch/,
# so a run leaves nothing tracked behind.
#
# The text below is hostile on purpose. A display name and an author holding
# `&`, `<` and a quote, an accented letter, a display name also holding a
# backslash and a straight quote (both of which close a C# string literal the
# mod's own command description is written in), and a purpose whose first
# sentence ends on a CJK stop: each one breaks a substitution that writes
# values raw into ModInfo.xml or into a C# literal, splits sentences on `.!?`
# alone, or reduces an author name without normalizing it.
# ci/check-smoke-mod.py asserts what the scaffold has to make of them, and the
# mod's own xml-parses gate covers the file. Change any of these and that
# checker fails, on purpose.
name="CiSmoke"
author="CI & Müller"
display_name="CI & Smoke „Mod“ \Tag\ \"Quoted\""
purpose="このモッドはテンプレートから動くbmodレットである。Throwaway CI smoke mod proving the template scaffolds into a working modlet."
target_dir=".scratch/anvil-smoke"
csharp="yes"
assets="no"
clone="no"
hordeforge_root=".scratch/hordeforge"
